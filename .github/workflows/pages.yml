name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布站点运行需要的文件，避免把 docs/tests/scripts 等源码目录推到线上
      - name: Stage static site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js assets children data diagnose explore _site/
          touch _site/.nojekyll

      # enablement=true：仓库尚未开启 Pages 时，由此步骤自动创建 Pages 站点
      # （默认 false，否则 configure-pages 会因 GET Pages site 返回 404 直接失败）
      - uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
